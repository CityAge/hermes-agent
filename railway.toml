[build]
    builder = "DOCKERFILE"
    dockerfilePath = "Dockerfile"

[deploy]
    startCommand = "echo 'DEBUG START' && ls -la /opt/hermes/docker/ && cat /opt/hermes/docker/entrypoint.sh && echo '---ENV CHECK---' && env | grep -i telegram && echo '---TRYING ENTRYPOINT---' && bash -x /opt/hermes/docker/entrypoint.sh gateway 2>&1"
    restartPolicyType = "ON_FAILURE"
    restartPolicyMaxRetries = 10
