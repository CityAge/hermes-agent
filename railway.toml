[build]
    builder = "DOCKERFILE"
    dockerfilePath = "Dockerfile"

[deploy]
    startCommand = "mkdir -p /opt/data/gateway && printf 'platform: telegram\nenabled: true\n' > /opt/data/gateway/telegram.yaml && echo \"OPENROUTER_API_KEY=$OPENROUTER_API_KEY\" > /opt/data/.env && echo \"TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN\" >> /opt/data/.env && echo \"TELEGRAM_ALLOWED_USERS=$TELEGRAM_ALLOWED_USERS\" >> /opt/data/.env && HERMES_HOME=/opt/data hermes gateway 2>&1 || echo EXITED $?"
    restartPolicyType = "ON_FAILURE"
    restartPolicyMaxRetries = 10
