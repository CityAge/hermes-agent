startCommand = "echo 'STEP 1: Starting' && mkdir -p /opt/data && echo 'STEP 2: Dir created' && echo \"OPENROUTER_API_KEY=$OPENROUTER_API_KEY\" >> /opt/data/.env && echo \"TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN\" >> /opt/data/.env && echo \"TELEGRAM_ALLOWED_USERS=$TELEGRAM_ALLOWED_USERS\" >> /opt/data/.env && echo 'STEP 3: Env written' && cat /opt/data/.env && echo 'STEP 4: Launching entrypoint' && ls -la /opt/hermes/docker/entrypoint.sh && /opt/hermes/docker/entrypoint.sh gateway"
