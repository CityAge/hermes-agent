[build]
    builder = "DOCKERFILE"
    dockerfilePath = "Dockerfile"

[deploy]
    startCommand = "mkdir -p /opt/data && echo \"OPENROUTER_API_KEY=$OPENROUTER_API_KEY\" >> /opt/data/.env && echo \"TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN\" >> /opt/data/.env && echo \"TELEGRAM_ALLOWED_USERS=$TELEGRAM_ALLOWED_USERS\" >> /opt/data/.env && mkdir -p /opt/data/gateway && echo 'platform: telegram' > /opt/data/gateway/telegram.yaml && echo 'enabled: true' >> /opt/data/gateway/telegram.yaml && hermes gateway"
    restartPolicyType = "ON_FAILURE"
    restartPolicyMaxRetries = 10
