[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "mkdir -p /data/.hermes && echo \"OPENROUTER_API_KEY=$OPENROUTER_API_KEY\" > /data/.hermes/.env && echo \"TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN\" >> /data/.hermes/.env && echo \"TELEGRAM_ALLOWED_USERS=$TELEGRAM_ALLOWED_USERS\" >> /data/.hermes/.env && hermes gateway"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
